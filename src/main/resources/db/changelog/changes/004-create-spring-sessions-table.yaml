databaseChangeLog:
  - changeSet:
      id: 4
      author: "Maxim"
      changes:
        - createTable:
            tableName: spring_session
            columns:
              - column:
                  name: primary_id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: creation_time
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_access_time
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: max_inactive_interval
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_time
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: principal_name
                  type: VARCHAR(100)

        - createIndex:
            tableName: spring_session
            indexName: spring_session_ix_session_id
            columns:
              - column:
                  name: session_id

        - createIndex:
            tableName: spring_session
            indexName: spring_session_ix_expiry_time
            columns:
              - column:
                  name: expiry_time

        - createIndex:
            tableName: spring_session
            indexName: spring_session_ix_principal_name
            columns:
              - column:
                  name: principal_name

        - createTable:
            tableName: spring_session_attributes
            columns:
              - column:
                  name: session_primary_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: attribute_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: attribute_bytes
                  type: BYTEA
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: spring_session_attributes
            columnNames: session_primary_id, attribute_name
            constraintName: spring_session_attributes_pk

        - addForeignKeyConstraint:
            baseTableName: spring_session_attributes
            baseColumnNames: session_primary_id
            constraintName: spring_session_attributes_fk
            referencedTableName: spring_session
            referencedColumnNames: primary_id
            onDelete: CASCADE